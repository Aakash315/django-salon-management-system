{% extends "base.html" %}

{% block title %}
Add Service
{% endblock %}

{% block content %}

<div class="dashboard">

    {% include "admin_dashboard/sidebar.html" %}

    <main class="main-content">

        <div class="content-card">

            <h3 class="mb-4">
                Add New Service
            </h3>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Service Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Hair Cut"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                        placeholder="Service description"
                    ></textarea>

                </div>


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Default Price
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                ₹
                            </span>

                            <input
                                type="number"
                                name="default_price"
                                class="form-control"
                                min="0"
                                step="0.01"
                                required
                            >

                        </div>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Default Duration
                        </label>

                        <div class="input-group">

                            <input
                                type="number"
                                name="default_duration"
                                class="form-control"
                                min="5"
                                required
                            >

                            <span class="input-group-text">
                                minutes
                            </span>

                        </div>

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Service
                </button>

                <a
                    href="{% url 'admin_services' %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </main>

</div>

{% endblock %}
