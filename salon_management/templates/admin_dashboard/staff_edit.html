{% extends "base.html" %}

{% block title %}
Edit Staff
{% endblock %}

{% block content %}

<div class="dashboard">

    {% include "admin_dashboard/sidebar.html" %}

    <main class="main-content">

        <div class="content-card">

            <h3>
                Edit Staff
            </h3>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ staff.name }}"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Phone
                    </label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        value="{{ staff.phone }}"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ staff.email }}"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Designation
                    </label>

                    <input
                        type="text"
                        name="designation"
                        class="form-control"
                        value="{{ staff.designation }}"
                    >

                </div>


                <div class="form-check mb-4">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        name="is_available"
                        id="is_available"
                        {% if staff.is_available %}
                        checked
                        {% endif %}
                    >

                    <label
                        class="form-check-label"
                        for="is_available"
                    >
                        Staff Active
                    </label>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Changes
                </button>

                <a
                    href="{% url 'admin_staff' %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </main>

</div>

{% endblock %}
