{% extends "base.html" %}

{% block title %}
Customer Login
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            ✦ SALON
        </div>

        <h2>
            Welcome
        </h2>

        <p class="text-muted mb-4">
            Enter your mobile number to continue.
        </p>


        <form method="POST">

            {% csrf_token %}

            <label class="form-label">
                Mobile Number
            </label>

            <div class="input-group mb-4">

                <span class="input-group-text">
                    +91
                </span>

                <input
                    type="tel"
                    name="phone"
                    class="form-control"
                    placeholder="9876543210"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    inputmode="numeric"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary w-100 btn-lg"
            >
                Continue
            </button>

        </form>


        <div class="auth-footer">

            <small>
                By continuing, you agree to our
                booking terms.
            </small>

        </div>

    </div>

</div>

{% endblock %}
