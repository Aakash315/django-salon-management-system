{% extends "base.html" %}

{% block title %}
Verify OTP
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            ✦ SALON
        </div>

        <h2>
            Verify OTP
        </h2>

        <p class="text-muted">
            We sent a 6-digit OTP to
        </p>

        <strong>
            {{ phone }}
        </strong>


        <form
            method="POST"
            class="mt-4"
        >

            {% csrf_token %}

            <input
                type="text"
                name="otp"
                id="otp"
                class="form-control otp-input"
                maxlength="6"
                minlength="6"
                pattern="[0-9]{6}"
                inputmode="numeric"
                autocomplete="one-time-code"
                placeholder="000000"
                required
                autofocus
            >


            <button
                type="submit"
                class="btn btn-primary w-100 btn-lg mt-4"
            >
                Verify OTP
            </button>

        </form>


        <div class="text-center mt-4">

            <span class="text-muted">
                Didn't receive OTP?
            </span>

            <form
                method="POST"
                action="{% url 'resend_otp' %}"
                class="d-inline"
            >

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-link p-0"
                >
                    Resend OTP
                </button>

            </form>

        </div>


        <div class="text-center mt-3">

            <a href="{% url 'phone_login' %}">
                Change phone number
            </a>

        </div>

    </div>

</div>

{% endblock %}
