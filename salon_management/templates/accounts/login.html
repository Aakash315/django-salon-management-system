{% extends "base.html" %}

{% block title %}
Login | Salon
{% endblock %}

{% block content %}

<div class="login-page">

    <div class="login-card">

        <div class="brand">
            <h2>✦ SALON</h2>
            <p>Salon Management System</p>
        </div>

        <h4 class="mb-4">Welcome Back</h4>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">
                    Phone Number or Username
                </label>

                <input
                    type="text"
                    name="identifier"
                    class="form-control"
                    placeholder="Enter phone number or username"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button
                type="submit"
                class="btn btn-primary w-100"
            >
                Login
            </button>

        </form>

        <div class="text-center mt-4">
            <a href="{% url 'phone_login' %}">
                Login with OTP
            </a>
        </div>

    </div>

</div>

{% endblock %}
