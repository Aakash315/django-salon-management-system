{% extends "base.html" %}

{% block title %}
Staff Availability
{% endblock %}

{% block content %}

<div class="dashboard">

    {% include "staff/sidebar.html" %}

    <main class="main-content">

        <div class="topbar">

            <div>

                <h2>Working Hours</h2>

                <p class="text-muted">
                    Set your weekly working schedule.
                </p>

            </div>

        </div>


        <div class="content-card">

            <form
                method="POST"
                action="{% url 'save_availability' %}"
            >

                {% csrf_token %}


                <!-- MONDAY -->

                <div class="availability-row">

                    <div class="day-name">
                        Monday
                    </div>

                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            name="monday_available"
                            id="monday_available"
                            {% for item in availability %}
                                {% if item.day == 0 and item.is_available %}
                                    checked
                                {% endif %}
                            {% endfor %}
                        >

                        <label
                            class="form-check-label"
                            for="monday_available"
                        >
                            Working
                        </label>

                    </div>

                    <input
                        type="time"
                        name="monday_start"
                        class="form-control"
                        value="{% for item in availability %}{% if item.day == 0 %}{{ item.start_time|time:'H:i' }}{% endif %}{% endfor %}"
                    >

                    <span>to</span>

                    <input
                        type="time"
                        name="monday_end"
                        class="form-control"
                        value="{% for item in availability %}{% if item.day == 0 %}{{ item.end_time|time:'H:i' }}{% endif %}{% endfor %}"
                    >

                </div>


                <!-- TUESDAY -->

                <div class="availability-row">

                    <div class="day-name">
                        Tuesday
                    </div>

                    <div class="form-check">

                        <input

                            {% for item in availability %}
                                {% if item.day == 1 and item.is_available %}
                                    checked
                                {% endif %}
                            {% endfor %}
                        >

                        <label
                            class="form-check-label"
                            for="tuesday_available"
                        >
                            Working
                        </label>

                    </div>

                    <input
                        type="time"
                        name="tuesday_start"
                        class="form-control"
                        value="{% for item in availability %}{% if item.day == 1 %}{{ item.start_time|time:'H:i' }}{% endif %}{% endfor %}"
                    >

                    <span>to</span>

                    <input
                        type="time"
                        name="tuesday_end"
                        class="form-control"
                        value="{% for item in availability %}{% if item.day == 1 %}{{ item.end_time|time:'H:i' }}{% endif %}{% endfor %}"

                </div>

                                {% endif %}
                            {% endfor %}

                    <div class="day-name">

                </div>


                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Working Hours
                    </button>

                </div>

            </form>

        </div>

    </main>

</div>

{% endblock %}
