{% extends "base.html" %}

{% block title %}
Edit Service
{% endblock %}

{% block content %}

<div class="dashboard">

    {% include "staff/sidebar.html" %}

    <main class="main-content">

        <div class="content-card">

            <h3>
                Edit {{ staff_service.service.name }}
            </h3>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Price
                    </label>

                    <input
                        type="number"
                        name="price"
                        class="form-control"
                        value="{{ staff_service.price }}"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Duration
                    </label>

                    <div class="input-group">

                        <input
                            type="number"
                            name="duration"
                            class="form-control"
                            value="{{ staff_service.duration }}"
                            min="5"
                            required
                        >

                        <span class="input-group-text">
                            minutes
                        </span>

                    </div>

                </div>


                <div class="form-check mb-4">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        name="is_available"
                        id="available"
                        {% if staff_service.is_available %}
                        checked
                        {% endif %}
                    >

                    <label
                        class="form-check-label"
                        for="available"
                    >
                        Service Available
                    </label>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Changes
                </button>

                <a
                    href="{% url 'staff_services' %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </main>

</div>

{% endblock %}
