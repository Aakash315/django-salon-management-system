{% extends "base.html" %}

{% block title %}
Staff Profile
{% endblock %}

{% block content %}

<div class="dashboard">

    {% include "staff/sidebar.html" %}

    <main class="main-content">

        <div class="topbar">

            <div>
                <h2>My Profile</h2>

                <p class="text-muted">
                    Manage your staff profile.
                </p>
            </div>

        </div>


        <div
            class="content-card"
            style="max-width: 700px;"
        >

            <form method="POST">

                {% csrf_token %}


                <div class="mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ staff.name }}"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Phone Number
                    </label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        value="{{ staff.phone }}"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ staff.email }}"
                    >

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Designation
                    </label>

                    <input
                        type="text"
                        name="designation"
                        class="form-control"
                        value="{{ staff.designation }}"
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Changes
                </button>

            </form>

        </div>

    </main>

</div>

{% endblock %}
