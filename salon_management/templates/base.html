{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Salon Management
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

    {% block extra_css %}
    {% endblock %}
</head>

<body>
    {% if messages %}

<div class="messages-container">

    {% for message in messages %}

        <div
            class="alert
            {% if message.tags == 'error' %}
                alert-danger
            {% elif message.tags == 'success' %}
                alert-success
            {% else %}
                alert-info
            {% endif %}
            alert-dismissible fade show"
            role="alert"
        >

            {{ message }}

            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert"
            ></button>

        </div>

    {% endfor %}

</div>

{% endif %}

{% block content %}
{% endblock %}

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

{% block extra_js %}
{% endblock %}

</body>
</html>
